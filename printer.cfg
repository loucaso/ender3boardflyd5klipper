[include mainsail.cfg]
[include boards/FLY_D5.cfg]
[include macros.cfg]
[include Adaptive_Meshing.cfg]
[include Line_Purge.cfg]
[exclude_object]



[mcu]
serial: /dev/ttyACM0

[virtual_sdcard]
path: ~/printer_data/gcodes

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

########################################
# Temperatura
########################################
[temperature_sensor FLY-D5]
sensor_type: temperature_host

########################################
# Stepper drivers (STEP/DIR mode - NO UART / NO SPI)
########################################
[stepper_x]
step_pin: D0_STEP
dir_pin: !D0_DIR
enable_pin: !D0_EN
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PB4        # Endstop X = PB4 (pull-up + invert)
position_endstop: 0
position_min: -10
position_max: 235
homing_speed: 40

[stepper_y]
step_pin: D1_STEP
dir_pin: !D1_DIR
enable_pin: !D1_EN
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PB3        # Endstop Y = PB3 (pull-up + invert)
position_endstop: 0
position_min: -10
position_max: 235
homing_speed: 40

[stepper_z]
step_pin: D2_STEP
dir_pin: D2_DIR       # ajustei para D2_DIR conforme sua última configuração
enable_pin: !D2_EN
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop    # usa o CR-Touch
position_min: -5.0
position_max: 240
homing_speed: 5



[bltouch]
sensor_pin: ^PB5
control_pin: SERVO
x_offset: -25
y_offset: -30
#z_offset: 2.00
speed:35
samples:4
samples_result: median
samples_tolerance: 0.0075
samples_tolerance_retries: 10
probe_with_touch_mode: true
stow_on_each_sample: false

#====================================================================
# BED MESH PARAMETERS
#====================================================================

[bed_mesh]
speed: 120
horizontal_move_z: 8
mesh_min: 25,20
mesh_max: 210,205
probe_count: 8,8
algorithm: bicubic
fade_start: 0.0
fade_end: 10.0
fade_target: 0



[safe_z_home]
home_xy_position: 120, 120
speed: 75
z_hop: 10
z_hop_speed: 5
move_to_previous: true




[extruder]
step_pin: D3_STEP
dir_pin: !D3_DIR
enable_pin: !D3_EN
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: HEAT0
sensor_pin: HEAT0_TEMP
sensor_type: EPCOS 100K B57560G104F
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 350

pressure_advance: 0.035  # bom ponto de partida para Bowden
pressure_advance_smooth_time: 0.04

max_extrude_only_distance: 100.0
max_extrude_cross_section: 8  #2 seguro para PLA, PETG, ABS

[idle_timeout]
timeout: 120


########################################
# Bed
########################################
[heater_bed]
heater_pin: BED_OUT
sensor_pin: BED_TEMP
sensor_type: EPCOS 100K B57560G104F
#control: watermark
min_temp: 0
max_temp: 300

########################################
# Fan
########################################
[fan]
pin: FAN0



########################################
# Hotend Fan (Fan1) – automático
########################################
[heater_fan hotend_fan]
pin: FAN1
heater: extruder
# O ventilador liga quando o hotend está quente
# (ajuste o threshold conforme desejar)
heater_temp: 50.0
# Pode adicionar um pequeno atraso para evitar ligar/desligar rápido
fan_speed: 1.0


########################################
